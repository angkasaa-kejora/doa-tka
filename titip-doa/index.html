<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titip Doa TKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: satu kartu slide dibingkai grid foto polaroid di empat sisi; halaman balasan berupa masonry kartu kecil. */
:root{
  --bg:#fff1f5; --ink:#4b2a3c; --muted:#8a6577; --card:#fffafc; --line:#f6c6d6;
  --pink:#e8457c; --pink-soft:#ffd3e1; --blue:#d3e9ff; --butter:#fff0a6; --mint:#cff3e1; --lilac:#e8dcff;
  --paper:#ffffff; --paper-ink:#8a5f74; --tape:rgba(255,160,196,.7);
  --shadow:0 12px 28px rgba(232,69,124,.16); --on-pink:#ffffff; --hl:#ffe08a;
  --f-display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Caveat','Bradley Hand','Segoe Script',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1320; --ink:#ffe8f0; --muted:#d8aec0; --card:#2c1a2e; --line:#5c3459;
  --pink:#ff7aa6; --pink-soft:#4d2a47; --blue:#24405a; --butter:#5a5024; --mint:#25503f; --lilac:#41346a;
  --paper:#fdf1f6; --paper-ink:#80566b; --tape:rgba(255,138,180,.6);
  --shadow:0 12px 28px rgba(0,0,0,.4); --on-pink:#2a1226; --hl:#6e5a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1320; --ink:#ffe8f0; --muted:#d8aec0; --card:#2c1a2e; --line:#5c3459;
  --pink:#ff7aa6; --pink-soft:#4d2a47; --blue:#24405a; --butter:#5a5024; --mint:#25503f; --lilac:#41346a;
  --paper:#fdf1f6; --paper-ink:#80566b; --tape:rgba(255,138,180,.6);
  --shadow:0 12px 28px rgba(0,0,0,.4); --on-pink:#2a1226; --hl:#6e5a1f; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:auto}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--line) 1.3px, transparent 1.6px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-inline:max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
  padding-block:0 40px; overflow-x:hidden; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:1020px;margin:0 auto;position:relative;z-index:1}

/* floating stickers */
.floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaters span{position:absolute;font-size:30px;opacity:.8;animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(8deg)}}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--f-hand);font-size:22px;font-weight:700;color:var(--pink)}
.nav{display:flex;gap:8px}
.navbtn{border:2.5px solid var(--pink-soft);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.navbtn[aria-current="page"]{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.count{background:var(--butter);color:var(--ink);border-radius:999px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}

/* slide card */
.stage{padding-top:14px}
.card{position:relative;background:var(--card);border:3px solid var(--pink-soft);border-radius:30px;box-shadow:var(--shadow)}
.card.in-next{animation:inNext .35s ease-out}
.card.in-prev{animation:inPrev .35s ease-out}
@keyframes inNext{from{transform:translateX(28px)}to{transform:none}}
@keyframes inPrev{from{transform:translateX(-28px)}to{transform:none}}
.stk{position:absolute;font-size:34px;line-height:1;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.stk.a{top:-16px;left:-8px;transform:rotate(-14deg)}
.stk.b{top:-14px;right:-8px;transform:rotate(12deg)}
.stk.c{bottom:-16px;left:-6px;transform:rotate(10deg)}
.stk.d{bottom:-14px;right:-8px;transform:rotate(-10deg)}

.frame{display:grid;grid-template-columns:1fr;grid-template-areas:"top" "content" "bottom"}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:22px 20px 14px}
.strip.top{grid-area:top}
.strip.bottom{grid-area:bottom;padding:14px 20px 24px}
.side{display:none;grid-area:left;flex-direction:column;gap:22px;padding:22px 6px 22px 22px;justify-content:center}
.side.right{grid-area:right;padding:22px 22px 22px 6px}
.content{grid-area:content;min-width:0;padding:10px 22px}
@media (min-width:640px){
  .strip{grid-template-columns:repeat(4,1fr);gap:18px}
}
@media (min-width:860px){
  .frame{grid-template-columns:150px minmax(0,1fr) 150px;grid-template-areas:"top top top" "left content right" "bottom bottom bottom"}
  .side{display:flex}
  .content{padding:10px 14px}
}

.pol{margin:0;position:relative;background:var(--paper);padding:5px 5px 6px;border-radius:3px;box-shadow:0 5px 12px rgba(0,0,0,.18);transform:rotate(var(--r,0deg));transition:transform .25s}
.pol::before{content:"";position:absolute;top:-8px;left:50%;width:42%;height:15px;margin-left:-21%;background:var(--tape);transform:rotate(-4deg);border-radius:2px;z-index:2}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;background:var(--pink-soft)}
.pol figcaption{font-family:var(--f-hand);font-weight:700;font-size:17px;line-height:20px;color:var(--paper-ink);text-align:center;height:20px;overflow:hidden;white-space:nowrap}
@media (max-width:639px){.pol figcaption{display:none}.pol{padding-bottom:5px}}
@media (hover:hover){.pol:hover{transform:rotate(0) scale(1.07);z-index:4}}

.chip{display:inline-flex;align-items:center;gap:8px;background:var(--lilac);border-radius:999px;padding:4px 14px;font-family:var(--f-hand);font-weight:700;font-size:23px;line-height:1.2;transform:rotate(-2deg)}
.text{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.text p{margin:0;font-size:clamp(16px,2.3vw,18px);line-height:1.8;overflow-wrap:anywhere}
.text p.greet{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.2;color:var(--pink)}
.text p.amin{font-family:var(--f-hand);font-weight:700;font-size:clamp(28px,5vw,36px);line-height:1.2;color:var(--pink);text-align:center;margin-top:4px}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);font-weight:700;padding:0 2px}

/* replies strip under slide text */
.rstrip{margin-top:20px;border-top:2.5px dashed var(--line);padding-top:12px;min-width:0}
.rstrip-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-weight:500;font-size:15px}
.link{background:none;border:0;color:var(--pink);font-weight:700;font-size:14px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.rrow{display:flex;gap:12px;overflow-x:auto;padding:10px 4px 14px;scroll-snap-type:x proximity}
.mini{flex:0 0 190px;scroll-snap-align:start;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.45;position:relative;color:var(--ink);transform:rotate(var(--r,0deg))}
.mini b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.mini span.s{position:absolute;top:-8px;right:-4px;font-size:22px}
.mini p{margin:2px 0 0;overflow-wrap:anywhere}
.c0{background:var(--butter)}.c1{background:var(--pink-soft)}.c2{background:var(--blue)}.c3{background:var(--lilac)}.c4{background:var(--mint)}
.empty{margin:0;color:var(--muted);font-size:14px;padding:8px 0}

/* controls */
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 4px 8px;flex-wrap:wrap}
.btn{border:2.5px solid var(--pink);background:var(--card);color:var(--pink);border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;transition:transform .15s}
.btn.solid{background:var(--pink);color:var(--on-pink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.btn:not(:disabled):hover{transform:translateY(-2px)}}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--pink);background:transparent;padding:0}
.dot[aria-current="true"]{background:var(--pink);width:28px;border-radius:999px}

/* form (slide 4) */
.tabs{display:flex;gap:6px;background:var(--pink-soft);border-radius:999px;padding:5px;margin-top:14px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.form h2{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4vw,28px);line-height:1.2;margin:0}
.form p.sub{margin:-6px 0 0;color:var(--muted);font-size:15px}
.field label{display:block;font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.2;margin-bottom:4px}
.field input,.field textarea{width:100%;background:var(--paper);color:#4b2a3c;border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;font:inherit;font-size:16px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.stks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:360px}
.stks input{position:absolute;opacity:0;pointer-events:none}
.stks label{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:var(--lilac);font-size:26px;cursor:pointer;border:3px solid transparent;margin:0;font-family:inherit}
.stks input:checked + label{border-color:var(--pink);background:var(--pink-soft);transform:rotate(-6deg) scale(1.08)}
.stks input:focus-visible + label{outline:3px solid var(--pink);outline-offset:2px}
.err{color:var(--pink);font-weight:700;margin:0;min-height:1.4em;font-size:15px}
.panel{margin-top:16px;background:var(--mint);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0}
.panel p{margin:0}
.login{width:100%;max-width:420px;margin:10px auto 0;text-align:left;align-items:stretch}
.login .btn{align-self:flex-start}
.panel textarea{width:100%;min-height:130px;background:var(--paper);color:#4b2a3c;border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* replies view */
.hero{padding-top:14px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.hero .mosaic{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:100%;max-width:560px;padding:8px 6px}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,7vw,48px);line-height:1.1;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--pink)}
.hero p{margin:0;color:var(--muted);max-width:46ch}
.masonry{columns:1;column-gap:22px;padding:26px 4px}
@media (min-width:640px){.masonry{columns:2}}
@media (min-width:960px){.masonry{columns:3}}
.reply{break-inside:avoid;display:block;position:relative;margin:0 0 26px;padding:22px 20px 18px;color:var(--ink);transform:rotate(var(--r,0deg));box-shadow:0 8px 18px rgba(0,0,0,.12);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.95) rotate(var(--r,0deg))}to{transform:scale(1) rotate(var(--r,0deg))}}
.reply .bigstk{position:absolute;top:-16px;right:-6px;font-size:40px;line-height:1;transform:rotate(14deg);filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.reply .who{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.2;margin:0;padding-right:36px;overflow-wrap:anywhere}
.reply .when{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.reply h4{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1.1;margin:10px 0 2px;color:var(--pink)}
.reply p{margin:0;font-size:16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.reply .del{margin-top:12px;border:2px solid var(--pink);background:transparent;color:var(--pink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.v0{background:var(--butter);border-radius:6px}
.v0::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:20px;margin-left:-45px;background:var(--tape);transform:rotate(-3deg);border-radius:2px}
.v1{background:var(--pink-soft);border-radius:20px;outline:2.5px dashed var(--pink);outline-offset:-9px}
.v1::after{content:"💗";position:absolute;bottom:-12px;left:18px;font-size:26px}
.v2{background:var(--blue);border-radius:26px 26px 26px 6px}
.v2::after{content:"";position:absolute;left:0;bottom:-14px;border:14px solid transparent;border-top-color:var(--blue);border-left-color:var(--blue);border-bottom:0;border-right:0}
.v3{background:var(--lilac);border-radius:28px;border:3px dotted var(--pink)}
.v4{background:var(--mint);border-radius:14px;border-top:10px solid var(--pink)}
.v4 .when::before{content:"balasan • "}
.skel{background:var(--pink-soft);min-height:120px;border-radius:20px;animation:pulse 1.1s ease-in-out infinite alternate}
.sk{height:14px;border-radius:8px;background:var(--card);opacity:.75;margin:12px 0}
.sk.l1{width:55%}.sk.l2{width:90%}.sk.l3{width:70%}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.note{text-align:center;color:var(--muted);padding:30px 10px;font-size:16px}
.note .btn{margin-top:12px}
.back{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:6px}

@media (prefers-reduced-motion: reduce){
  .floaters span,.card.in-next,.card.in-prev,.reply,.skel{animation:none}
  .pol,.btn{transition:none}
}
</style>
</head>
<body>

<div class="floaters" aria-hidden="true">
  <span style="left:3%;top:18%;animation-delay:0s">🌸</span>
  <span style="right:3%;top:26%;animation-delay:-1.5s">🦋</span>
  <span style="left:2%;top:58%;animation-delay:-3s">🎀</span>
  <span style="right:2%;top:68%;animation-delay:-2s">✨</span>
  <span style="left:6%;top:86%;animation-delay:-4s">📚</span>
  <span style="right:6%;top:90%;animation-delay:-0.8s">🌷</span>
  <span style="left:48%;top:96%;animation-delay:-2.6s">☁️</span>
</div>

<div class="wrap">
  <header class="bar">
    <div class="brand"><span>🤍</span> Titip Doa TKA <small>Dasa Semesta</small></div>
    <nav class="nav" aria-label="Halaman">
      <button class="navbtn" type="button" data-go="doa" aria-current="page">🤲 Doa</button>
      <button class="navbtn" type="button" data-go="balasan">💌 Balasan <span class="count" id="navcount">0</span></button>
    </nav>
  </header>

  <main>
    <section id="view-doa" class="stage" aria-label="Slide doa">
      <article class="card" id="card"></article>
      <div class="controls">
        <button class="btn" type="button" id="prev">‹ Sebelumnya</button>
        <div class="dots" id="dots" role="group" aria-label="Pilih slide"></div>
        <button class="btn solid" type="button" id="next">Lanjut ›</button>
      </div>
    </section>

    <section id="view-balasan" hidden aria-label="Balasan">
      <div class="hero">
        <div class="mosaic" id="mosaic"></div>
        <h1>Balasan dari <em>kalian</em> 💌</h1>
        <p>Kesan dan pesan yang masuk untuk kami. Terima kasih sudah mendoakan 🤍</p>
        <div class="back">
          <button class="btn" type="button" data-go="doa">‹ Kembali ke doa</button>
          <button class="btn solid" type="button" id="write-from-list">✍️ Tulis balasan</button>
          <button class="btn" type="button" id="reload-list">↻ Muat ulang</button>
          <button class="btn" type="button" id="logout-btn" hidden>🔒 Keluar</button>
        </div>
      </div>
      <div id="replies-body"></div>
    </section>
  </main>
</div>

  async function submitReply(f){

    try{

    window.scrollTo(0,0);
  }

  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click",function(){ go(b.getAttribute("data-go")); });
  });
  $("write-from-list").addEventListener("click", openForm);
  $("reload-list").addEventListener("click", function(){ if(unlocked) retryLoad(); });
  $("logout-btn").addEventListener("click", function(){
    unlocked = false; auth = null; replies = [];
    try{ sessionStorage.removeItem("doa-auth"); }catch(e){}
    renderReplies();
  });
  $("prev").addEventListener("click",function(){ goSlide(state.idx-1); });
  $("next").addEventListener("click",function(){
    if(state.idx===SLIDES.length-1) go("balasan"); else goSlide(state.idx+1);
  });

  /* swipe */
  var tx=0, ty=0;
  var stage = $("view-doa");
  stage.addEventListener("touchstart",function(e){ var t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; },{passive:true});
  stage.addEventListener("touchend",function(e){
    var t=e.changedTouches[0]; var dx=t.clientX-tx, dy=t.clientY-ty;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){
      var tag = (e.target && e.target.tagName) || "";
      if(tag==="INPUT"||tag==="TEXTAREA") return;
      if(dx<0 && state.idx<SLIDES.length-1) goSlide(state.idx+1);
      if(dx>0) goSlide(state.idx-1);
    }
  },{passive:true});
  document.addEventListener("keydown",function(e){
    if(state.view!=="doa") return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(tag==="INPUT"||tag==="TEXTAREA") return;
    if(e.key==="ArrowRight" && state.idx<SLIDES.length-1) goSlide(state.idx+1);
    if(e.key==="ArrowLeft") goSlide(state.idx-1);
  });

  /* ---------- boot ---------- */
  buildMosaic();
  updateCount();
  if(location.hash==="#balasan") state.view="balasan";
  show();

  window.addEventListener("hashchange",function(){
    var v = location.hash==="#balasan" ? "balasan" : "doa";
    if(v!==state.view) go(v);
  });

  function refreshViews(){
    updateCount();
    if(state.view==="balasan") renderReplies(); else fillStrip();
  }
  function applyList(list){
    replies = list.map(function(x){ return {id:String(x.id), createdAt:Number(x.createdAt)||0, name:x.name, kesan:x.kesan, pesan:x.pesan, sticker:x.sticker}; })
      .sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }).slice(0,100);
    loaded = true; loadError = false; slow = false; lastErr = "";
    clearTimeout(loadTimer);
    refreshViews();
  }
  function failLoad(e){
    clearTimeout(loadTimer);
    try{ lastErr = e ? String(e.code || e.message || e) : "tidak diketahui"; }catch(x){ lastErr = "tidak diketahui"; }
    if(!replies.length){ loadError = true; }
    loaded = true;
    refreshViews();
  }
  function markSlow(){ if(!loaded){ slow = true; refreshViews(); } }
  function url(){ return API_URL + "?u=" + encodeURIComponent(auth.u) + "&p=" + encodeURIComponent(auth.p) + "&t=" + Date.now(); }

  async function fetchReplies(){
    if(!hasApi || !auth) return;
    try{
      var res = await fetch(url());
      var j = await res.json();
      if(j && j.ok){ applyList(j.replies || []); }
      else { failLoad(j && j.error); }
    }catch(e){ failLoad(e); }
  }
  function retryLoad(){
    if(!hasApi || !auth) return;
    loaded = false; loadError = false; slow = false;
    clearTimeout(loadTimer); loadTimer = setTimeout(markSlow, 8000);
    refreshViews();
    fetchReplies();
  }
  /* login: true = berhasil, "denied" = ditolak server, "error" = tidak terhubung */
  async function tryUnlock(){
    if(!hasApi){ unlocked = true; loaded = true; refreshViews(); return true; }
    try{
      var res = await fetch(url());
      var j = await res.json();
      if(j && j.ok){
        unlocked = true;
        try{ sessionStorage.setItem("doa-auth", JSON.stringify(auth)); }catch(e){}
        applyList(j.replies || []);
        return true;
      }
      return "denied";
    }catch(e){ return "error"; }
  }

  async function connect(){
    connectDone = true;
    if(auth){ var r = await tryUnlock(); if(r!==true){ auth = null; try{ sessionStorage.removeItem("doa-auth"); }catch(e){} } }
    loaded = true; refreshViews();
  }
  connect();
})();
</script>
</body>
</html>
